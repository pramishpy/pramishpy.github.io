<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Pramish Pandey</title>
    
    <!-- Zero-Flash Theme Execution Script -->
    <script>
        (function() {
            try {
                var storedTheme = localStorage.getItem('portfolio-theme');
                if (storedTheme === 'dark' || storedTheme === 'light') {
                    document.documentElement.setAttribute('data-theme', storedTheme);
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Modular CSS Entry Point -->
    <link rel="stylesheet" href="css/main.css">

    <style>
        .error-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        .error-card {
            background: var(--surface-glass);
            border: 1px solid var(--surface-glass-border);
            border-radius: var(--radius-xl);
            padding: 3.5rem 2.5rem;
            max-width: 580px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }
        .error-code {
            font-family: var(--font-mono);
            font-size: clamp(4rem, 10vw, 6.5rem);
            font-weight: var(--weight-extrabold);
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: var(--text-2xl);
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        .error-desc {
            font-size: var(--text-base);
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas" aria-hidden="true"></canvas>
    <div class="ambient-glow glow-top-right" aria-hidden="true"></div>
    <div class="ambient-glow glow-bottom-left" aria-hidden="true"></div>

    <div class="error-wrapper">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Out of Bounds</h1>
            <p class="error-desc">
                The resource or pathway you are looking for has been relocated, archived, or does not exist in this repository.
            </p>
            <div class="flex justify-center gap-4">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-house"></i> Back to Home
                </a>
                <a href="index.html#projects" class="btn btn-secondary">
                    <i class="fas fa-cubes"></i> View Projects
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initTheme } from './js/modules/theme.js';
        import { initParticles } from './js/modules/particles.js';
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initParticles();
        });
    </script>
</body>
</html>
